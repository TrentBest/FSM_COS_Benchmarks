name: FSM_COS Benchmark Evidence

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      fsm_cos_ref:
        description: FSM_COS branch, tag, or commit to benchmark
        required: false
        default: development
        type: string

permissions:
  contents: read

concurrency:
  group: fsm-cos-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout FSM_COS source under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: ${{ inputs.fsm_cos_ref || 'development' }}
          path: source
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Record unique run identity and environment
        shell: pwsh
        run: |
          $sourceCommit = git -C source rev-parse HEAD
          $runLabel = "COSRUN-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          "RunId: $runLabel" | Out-File -FilePath BenchmarkEnvironment.txt -Encoding utf8
          "BenchmarkHarnessCommit: ${{ github.sha }}" | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          "FSM_COSSourceCommit: $sourceCommit" | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          "WorkflowRunId: ${{ github.run_id }}" | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          "WorkflowAttempt: ${{ github.run_attempt }}" | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          dotnet --info | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber | Format-List | Out-File -Append -FilePath BenchmarkEnvironment.txt -Encoding utf8
          "COS_BENCHMARK_COMMIT=${{ github.sha }}" >> $env:GITHUB_ENV

      - name: Restore benchmark harness and source under test
        run: dotnet restore FSM_COS_Benchmarks.slnx -p:FsmCosSourceProject=source/src/FSM_COS/FSM_COS.csproj

      - name: Build FSM_COS source under test in Release
        run: dotnet build source/src/FSM_COS/FSM_COS.csproj --configuration Release --no-restore

      - name: Build benchmark harness in Release
        run: dotnet build FSM_COS_Benchmarks.csproj --configuration Release --no-restore -p:FsmCosSourceProject=source/src/FSM_COS/FSM_COS.csproj -p:BuildProjectReferences=false

      - name: Run stable-ID benchmark suite
        shell: pwsh
        run: |
          dotnet bin/Release/net8.0/FSM_COS_Benchmarks.dll --filter "*COS_*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $reports = Get-ChildItem "BenchmarkDotNet.Artifacts/results/*-report.csv" -ErrorAction SilentlyContinue
          if (-not $reports -or $reports.Count -lt 1) {
            throw "BenchmarkDotNet produced no CSV result reports."
          }

          $rows = @($reports | ForEach-Object { Import-Csv $_.FullName })
          $expected = [ordered]@{
            "COS-CAT-001" = 4
            "COS-CAT-002" = 4
            "COS-CAT-003" = 4
            "COS-CAT-004" = 4
            "COS-MAN-001" = 4
            "COS-MAN-002" = 4
            "COS-MAN-003" = 4
            "COS-CMP-001" = 1
            "COS-CMP-002" = 4
            "COS-CMP-003" = 3
            "COS-CMP-004" = 4
            "COS-DEP-001" = 4
            "COS-ERR-001" = 1
            "COS-ERR-002" = 1
            "COS-LOAD-001" = 4
            "COS-RT-001" = 4
            "COS-RT-002" = 4
            "COS-RT-003" = 4
            "COS-RT-004" = 4
            "COS-RT-005" = 4
          }

          if ($rows.Count -ne 70) {
            throw "Expected exactly 70 measured benchmark rows from the catalog; found $($rows.Count)."
          }

          foreach ($id in $expected.Keys) {
            $matching = @($rows | Where-Object {
              (($_.PSObject.Properties | ForEach-Object { [string]$_.Value }) -join " ") -match [regex]::Escape($id.Replace("-", "_")) -or
              (($_.PSObject.Properties | ForEach-Object { [string]$_.Value }) -join " ") -match [regex]::Escape($id)
            })
            if ($matching.Count -ne $expected[$id]) {
              throw "$id expected $($expected[$id]) result rows but found $($matching.Count)."
            }
          }

          $invalid = @($rows | Where-Object {
            -not $_.Mean -or $_.Mean.Trim() -eq "" -or $_.Mean.Trim() -eq "NA"
          })
          if ($invalid.Count -gt 0) {
            throw "BenchmarkDotNet emitted $($invalid.Count) result rows without a valid Mean. Treating this run as failed."
          }

          "Validated all $($rows.Count) expected benchmark rows across $($reports.Count) CSV reports; stable IDs and per-ID row counts matched the catalog."

      - name: Preserve raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fsm-cos-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            BenchmarkDotNet.Artifacts/**
            BenchmarkEnvironment.txt
          if-no-files-found: warn
          retention-days: 90
